name: build-trellis-5090

# GPU-FREE build of the TRELLIS.2 sm_120 image -> ghcr.io. No GPU runner needed:
# the Dockerfile runs pod_setup.sh with BUILD_ONLY=1 (nvcc cross-compiles for
# sm_120; all runtime GPU checks defer to the pod's first-run). Pushes to
# ghcr.io/<owner>/trellis-5090 using the built-in GITHUB_TOKEN — no PAT required
# when this repo lives under the target org/user (e.g. littlehewy-blip).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag"
        default: "v1"
      max_jobs:
        description: "compile parallelism (KEEP 1 for flash-attn sm_120 on 16GB runner)"
        default: "1"

concurrency:
  group: build-trellis
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to ghcr.io — no PAT needed
    steps:
      - name: Free runner disk (CUDA devel image + compile needs >14GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Add swap (flash-attn sm_120 compile peaks >16GB RAM on the free runner)
        run: |
          echo "== disk before swap =="; df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "== swap active =="; swapon --show; free -h
          echo "== disk after swap =="; df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/trellis-5090:${{ github.event.inputs.tag }}
          build-args: |
            MAX_JOBS=${{ github.event.inputs.max_jobs }}
          provenance: false
